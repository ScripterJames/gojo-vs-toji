name: Hakone browser regression

on:
  push:
    branches: [main, hakone-town-expansion, hakone-shop-polish, hakone-interactions-grounding, hakone-town-travelers, hakone-strongest-onsen]
    paths:
      - "adventure/**"
      - "tests/test_hakone.py"
      - "tests/test_hakone_arena.py"
      - "tests/test_hakone_origin.py"
      - "tests/test_hakone_shop_art.py"
      - "tests/test_hakone_interactions.py"
      - "tests/test_hakone_travelers.py"
      - "tests/test_hakone_strongest.py"
      - "tests/test_hakone_onsen.py"
      - "tests/test_hakone_food_art.py"
      - ".github/workflows/hakone-browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-regression:
    name: Chromium town and arena checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright browser and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Test Hakone Life interactions
        run: python tests/test_hakone.py
      - name: Test Hakone Arena combat
        run: python tests/test_hakone_arena.py
      - name: Test real-origin Hakone integration
        run: python tests/test_hakone_origin.py
      - name: Test shop art and preparation at a real origin
        run: python tests/test_hakone_shop_art.py
      - name: Test furnished rooms, navigation and foot anchors
        run: python tests/test_hakone_interactions.py
      - name: Test town travelers, directions and scenery
        run: python tests/test_hakone_travelers.py
      - name: Test strongest fighter and next-challenger ladder
        run: python tests/test_hakone_strongest.py
      - name: Test actual onsen washing, soaking and safe exits
        run: python tests/test_hakone_onsen.py
      - name: Test warm restaurants and untouched convenience store
        run: python tests/test_hakone_food_art.py
